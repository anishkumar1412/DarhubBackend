openapi: 3.0.0
info:
  title: Darhub API
  version: 1.0.0
  description: API documentation for Darhub backend

servers:
  - url: http://localhost:5678
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
        mobile_number:
          type: string
        is_superuser:
          type: boolean
        user_type:
          type: integer

    UserProfile:
      type: object
      properties:
        user_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        whatsapp_number:
          type: string
        user_image_url:
          type: string
        aadhar_number:
          type: string
        pan_card_number:
          type: string

    Address:
      type: object
      properties:
        lane_1:
          type: string
        lane_2:
          type: string
        state:
          type: string
        district:
          type: string
        block:
          type: string
        village:
          type: string
        pincode:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - username
        - mobile_number
        - addresses
        - first_name
        - last_name
        - role_privilage_id
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        username:
          type: string
        mobile_number:
          type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        first_name:
          type: string
        last_name:
          type: string
        whatsapp_number:
          type: string
        user_image_original_filename:
          type: string
        aadhar_number:
          type: string
        pan_card_number:
          type: string
        role_privilage_id:
          type: integer

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
        user_id:
          type: integer
        token:
          type: string

    State:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    District:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        state_id:
          type: integer

    Block:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        district_id:
          type: integer

    Drone:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        # Add more properties as needed

    Order:
      type: object
      properties:
        id:
          type: integer
        booking_id:
          type: string
        # Add more properties

    Comment:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        # Add more properties

    Column:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        module:
          type: string

paths:
  /:
    get:
      summary: Welcome message
      responses:
        '200':
          description: Welcome message
          content:
            text/plain:
              schema:
                type: string

  /api/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                user_image_original_filename:
                  type: string
                  format: binary
                addresses:
                  type: string
                  description: JSON string of addresses array
                email:
                  type: string
                password:
                  type: string
                username:
                  type: string
                mobile_number:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                whatsapp_number:
                  type: string
                aadhar_number:
                  type: string
                pan_card_number:
                  type: string
                role_privilage_id:
                  type: integer
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Bad request
        '500':
          description: Internal server error

  /api/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
        '404':
          description: User not found
        '500':
          description: Internal server error

  /api/deleteUser:
    post:
      summary: Delete user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
      responses:
        '200':
          description: User deleted
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /api/updateprofile:
    put:
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                # Add other fields
      responses:
        '200':
          description: Profile updated
        '500':
          description: Internal server error

  /api/refresh-token:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Invalid refresh token

  /api/get-user/{user_id}:
    get:
      summary: Get user by ID
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

  /api/filter:
    post:
