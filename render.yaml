services:
  - type: web
    name: darhub-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000          # Render assigns its own port; this is just a fallback
      - key: TRUST_PROXY
        value: 1

      # ── Database (link to the Render Postgres below) ───────────────
      - key: DB_HOST
        fromDatabase:
          name: darhub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: darhub-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: darhub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: darhub-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: darhub-db
          property: database
      - key: DB_DIALECT
        value: postgres

      # ── Secrets — fill these in the Render dashboard after deploy ──
      - key: JWT_SECRET
        sync: false           # Render will prompt you to enter it
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: CLOUD_KEY
        sync: false
      - key: CLOUD_SECRET
        sync: false

databases:
  - name: darhub-db
    plan: free
    databaseName: drone_booking_management
    user: darhub
